<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid Pattern Background -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Main Logo (Left Side) -->
  <g transform="translate(150, 165)">
    <circle cx="150" cy="150" r="140" fill="white" opacity="0.95"/>
    <rect x="60" y="60" width="180" height="180" rx="15" fill="#2563EB"/>
    <line x1="90" y1="60" x2="90" y2="240" stroke="white" stroke-width="4"/>
    <line x1="120" y1="60" x2="120" y2="240" stroke="white" stroke-width="4"/>
    <line x1="150" y1="60" x2="150" y2="240" stroke="white" stroke-width="4"/>
    <line x1="180" y1="60" x2="180" y2="240" stroke="white" stroke-width="4"/>
    <line x1="210" y1="60" x2="210" y2="240" stroke="white" stroke-width="4"/>
    <line x1="60" y1="90" x2="240" y2="90" stroke="white" stroke-width="4"/>
    <line x1="60" y1="120" x2="240" y2="120" stroke="white" stroke-width="4"/>
    <line x1="60" y1="150" x2="240" y2="150" stroke="white" stroke-width="4"/>
    <line x1="60" y1="180" x2="240" y2="180" stroke="white" stroke-width="4"/>
    <line x1="60" y1="210" x2="240" y2="210" stroke="white" stroke-width="4"/>
    <rect x="120" y="120" width="60" height="60" rx="8" fill="white"/>
  </g>

  <!-- Text Content (Right Side) -->
  <text x="550" y="220" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    HitForget
  </text>

  <text x="550" y="290" font-family="Arial, sans-serif" font-size="48" font-weight="600" fill="white" opacity="0.95">
    Virtual Processors
  </text>

  <text x="550" y="360" font-family="Arial, sans-serif" font-size="32" fill="white" opacity="0.85">
    Arduino • STM32 • Raspberry Pi • ESP32
  </text>

  <text x="550" y="440" font-family="Arial, sans-serif" font-size="28" fill="white" opacity="0.8">
    No Physical Hardware Required
  </text>

  <text x="550" y="490" font-family="Arial, sans-serif" font-size="28" fill="white" opacity="0.8">
    Code in the Cloud • Deploy with AI
  </text>

  <!-- Badge -->
  <rect x="550" y="520" width="200" height="50" rx="25" fill="white"/>
  <text x="650" y="553" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2563EB" text-anchor="middle">
    Try Free
  </text>
</svg>
