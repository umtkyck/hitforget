version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: visucan-postgres
    environment:
      POSTGRES_DB: visucan
      POSTGRES_USER: visucan
      POSTGRES_PASSWORD: visucan_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visucan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Vercel KV alternative for local dev)
  redis:
    image: redis:7-alpine
    container_name: visucan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visucan-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - POSTGRES_URL=postgres://visucan:visucan_dev_password@postgres:5432/visucan
      - KV_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Device Backend
  device-backend:
    build:
      context: .
      dockerfile: device-backend/Dockerfile
    container_name: visucan-device-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - POSTGRES_URL=postgres://visucan:visucan_dev_password@postgres:5432/visucan
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./device-backend:/app
      - /app/node_modules
      - ./artifacts:/app/artifacts
    # Privileged mode for USB device access (development only)
    privileged: true
    devices:
      - /dev:/dev

volumes:
  postgres_data:
  redis_data:
